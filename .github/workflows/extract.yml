name: Extract VaM Base Meshes

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'vam_assets/**'
      - 'scripts/extract_meshes.py'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install UnityPy
        run: pip install UnityPy pillow

      - name: List vam_assets
        run: |
          echo "Files in vam_assets:"
          ls -la vam_assets/ || echo "(empty)"

      - name: Extract meshes
        run: python scripts/extract_meshes.py

      - name: Upload extracted meshes
        uses: actions/upload-artifact@v4
        with:
          name: vam-base-meshes
          path: out/
          if-no-files-found: warn
